name: 🚀 AI STV PREMIUM RDP

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "🕐 Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "20m"
          - "1h"
          - "3h"
          - "5h40m"

jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # STARTUP BANNER
      # ============================================================
      - name: 🎯 STARTING SYSTEM
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "        🤖 AI STV PREMIUM RDP SERVER" -ForegroundColor Yellow
          Write-Host "        ⚡ Powered by AI STV" -ForegroundColor Green
          Write-Host "        🕒 Duration: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host ""

          $frames = @('⣾', '⣽', '⣻', '⢿', '⡿', '⣟', '⣯', '⣷')

          for ($i = 0; $i -lt 10; $i++) {
              Write-Host "`r🚀 Initializing system... $($frames[$i % 8])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Milliseconds 100
          }

          Write-Host "`r✅ System initialization completed.          " -ForegroundColor Green
          Write-Host ""


      # ============================================================
      # CONFIGURE RDP
      # ============================================================
      - name: 🔧 CONFIGURE REMOTE DESKTOP
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "        🔧 CONFIGURING REMOTE DESKTOP" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host ""

          $steps = @(
              @{
                  Name = "Enable Remote Desktop"
                  Script = {
                      Set-ItemProperty `
                        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                        -Name "fDenyTSConnections" `
                        -Value 0 `
                        -Force
                  }
              },

              @{
                  Name = "Configure RDP authentication"
                  Script = {
                      Set-ItemProperty `
                        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                        -Name "UserAuthentication" `
                        -Value 0 `
                        -Force
                  }
              },

              @{
                  Name = "Configure RDP security layer"
                  Script = {
                      Set-ItemProperty `
                        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                        -Name "SecurityLayer" `
                        -Value 0 `
                        -Force
                  }
              },

              @{
                  Name = "Open RDP port 3389"
                  Script = {
                      netsh advfirewall firewall add rule `
                        name="RDP-Premium" `
                        dir=in `
                        action=allow `
                        protocol=TCP `
                        localport=3389 `
                        profile=any

                      netsh advfirewall firewall add rule `
                        name="RDP-Premium-Out" `
                        dir=out `
                        action=allow `
                        protocol=TCP `
                        localport=3389 `
                        profile=any
                  }
              },

              @{
                  Name = "Start Remote Desktop services"
                  Script = {
                      Set-Service `
                        -Name TermService `
                        -StartupType Automatic `
                        -ErrorAction SilentlyContinue

                      Set-Service `
                        -Name UmRdpService `
                        -StartupType Automatic `
                        -ErrorAction SilentlyContinue

                      Start-Service `
                        -Name TermService `
                        -ErrorAction SilentlyContinue

                      Start-Service `
                        -Name UmRdpService `
                        -ErrorAction SilentlyContinue
                  }
              }
          )

          foreach ($step in $steps) {
              Write-Host "│ 📋 $($step.Name)..." -NoNewline -ForegroundColor White

              try {
                  & $step.Script
                  Write-Host "`r│ ✅ $($step.Name)                         " -ForegroundColor Green
              }
              catch {
                  Write-Host "`r│ ⚠️ $($step.Name) - Skipped safely       " -ForegroundColor Yellow
              }

              Start-Sleep -Milliseconds 500
          }

          Write-Host ""
          Write-Host "🎯 Remote Desktop configuration completed." -ForegroundColor Green
          Write-Host ""


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: 👤 CREATE PREMIUM RDP ACCOUNT
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "        👤 CREATING PREMIUM RDP ACCOUNT" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host ""

          function New-PremiumPassword {

              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
              $lower = 'abcdefghijkmnpqrstuvwxyz'
              $numbers = '23456789'
              $all = $upper + $lower + $numbers

              $password = ''

              $password += $upper[(Get-Random -Minimum 0 -Maximum $upper.Length)]
              $password += $lower[(Get-Random -Minimum 0 -Maximum $lower.Length)]
              $password += $numbers[(Get-Random -Minimum 0 -Maximum $numbers.Length)]

              for ($i = 1; $i -le 5; $i++) {
                  $password += $all[(Get-Random -Minimum 0 -Maximum $all.Length)]
              }

              return -join ($password.ToCharArray() | Sort-Object { Get-Random })
          }

          if ($env:CUSTOM_RDP_PASS) {
              $password = $env:CUSTOM_RDP_PASS
              Write-Host "│ ℹ️ Using custom RDP password." -ForegroundColor Blue
          }
          else {
              $password = New-PremiumPassword
              Write-Host "│ ℹ️ Generated a random RDP password." -ForegroundColor Blue
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove old account if it exists
          try {
              Remove-LocalUser `
                -Name "AISTV-PREMIUM" `
                -ErrorAction SilentlyContinue

              Write-Host "│ ✅ Removed previous RDP account." -ForegroundColor Green
          }
          catch {
              Write-Host "│ ℹ️ No previous RDP account found." -ForegroundColor Blue
          }

          # Create account
          try {

              New-LocalUser `
                -Name "AISTV-PREMIUM" `
                -Password $securePassword `
                -AccountNeverExpires `
                -Description "AI STV Premium RDP Account"

              Write-Host "│ ✅ RDP account created." -ForegroundColor Green

              try {
                  Set-LocalUser `
                    -Name "AISTV-PREMIUM" `
                    -PasswordNeverExpires $true `
                    -ErrorAction SilentlyContinue
              }
              catch {
              }

              # Administrator
              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member "AISTV-PREMIUM" `
                -ErrorAction SilentlyContinue

              # Remote Desktop Users
              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member "AISTV-PREMIUM" `
                -ErrorAction SilentlyContinue

              Enable-LocalUser `
                -Name "AISTV-PREMIUM"

              Write-Host "│ ✅ Administrator permission configured." -ForegroundColor Green
              Write-Host "│ ✅ Remote Desktop permission configured." -ForegroundColor Green
          }
          catch {
              Write-Host "│ ❌ Failed to create RDP account: $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }

          "RDP_USER=AISTV-PREMIUM" >> $env:GITHUB_ENV
          "RDP_PASS=$password" >> $env:GITHUB_ENV

          $password | Out-File `
            -FilePath "$env:TEMP\rdp_password.txt" `
            -Encoding utf8 `
            -Force

          Write-Host ""
          Write-Host "✅ Premium RDP account is ready." -ForegroundColor Green
          Write-Host ""


      # ============================================================
      # RESTORE PREVIOUS BACKUP
      # ============================================================
      - name: 📥 RESTORE PREVIOUS RDP DATA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |

          $ErrorActionPreference = "Continue"

          $root = "C:\RDP-BACKUP"
          $archive = "$env:TEMP\rdp-latest.zip"
          $userHome = "C:\Users\AISTV-PREMIUM"

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Remove-Item `
            $archive `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "        📥 RESTORING PREVIOUS RDP DATA" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host ""

          try {

              $headers = @{
                  Authorization = "Bearer $env:GH_TOKEN"
                  Accept = "application/vnd.github+json"
                  "X-GitHub-Api-Version" = "2022-11-28"
              }

              $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"

              $response = Invoke-RestMethod `
                -Uri $api `
                -Headers $headers `
                -Method Get

              $artifact = $response.artifacts |
                  Where-Object {
                      $_.name -eq "rdp-backup" -and
                      $_.expired -eq $false
                  } |
                  Sort-Object created_at -Descending |
                  Select-Object -First 1

              if ($artifact) {

                  Write-Host "✅ Previous backup found." -ForegroundColor Green
                  Write-Host "📅 Created: $($artifact.created_at)" -ForegroundColor Cyan

                  Invoke-WebRequest `
                    -Uri $artifact.archive_download_url `
                    -Headers $headers `
                    -OutFile $archive

                  Expand-Archive `
                    -Path $archive `
                    -DestinationPath $root `
                    -Force

                  # Restore Desktop/Documents/Downloads
                  foreach ($folder in @(
                      "Desktop",
                      "Documents",
                      "Downloads"
                  )) {

                      $source = Join-Path $root $folder
                      $target = Join-Path $userHome $folder

                      New-Item `
                        -ItemType Directory `
                        -Path $target `
                        -Force | Out-Null

                      if (Test-Path -LiteralPath $source) {

                          robocopy `
                            $source `
                            $target `
                            /E `
                            /R:1 `
                            /W:1 `
                            /XJ `
                            /NFL `
                            /NDL `
                            /NP | Out-Null

                          Write-Host "✅ Restored: $folder" -ForegroundColor Green
                      }
                  }

                  # Restore Chrome
                  $chromeSource = Join-Path $root "Chrome\User Data"
                  $chromeTarget = Join-Path `
                    $userHome `
                    "AppData\Local\Google\Chrome\User Data"

                  if (Test-Path -LiteralPath $chromeSource) {

                      New-Item `
                        -ItemType Directory `
                        -Path $chromeTarget `
                        -Force | Out-Null

                      robocopy `
                        $chromeSource `
                        $chromeTarget `
                        /E `
                        /R:1 `
                        /W:1 `
                        /XJ `
                        /NFL `
                        /NDL `
                        /NP | Out-Null

                      Write-Host "✅ Restored: Chrome profile." -ForegroundColor Green
                      Write-Host "⚠️ Chrome login sessions may not survive on a new runner." -ForegroundColor Yellow
                  }

                  # Restore AppData\Roaming
                  $appDataSource = Join-Path `
                    $root `
                    "AppData\Roaming"

                  $appDataTarget = Join-Path `
                    $userHome `
                    "AppData\Roaming"

                  if (Test-Path -LiteralPath $appDataSource) {

                      New-Item `
                        -ItemType Directory `
                        -Path $appDataTarget `
                        -Force | Out-Null

                      robocopy `
                        $appDataSource `
                        $appDataTarget `
                        /E `
                        /R:1 `
                        /W:1 `
                        /XJ `
                        /NFL `
                        /NDL `
                        /NP | Out-Null

                      Write-Host "✅ Restored: AppData\Roaming." -ForegroundColor Green
                  }

                  # Restore Android configuration
                  $androidSource = Join-Path `
                    $root `
                    ".android"

                  $androidTarget = Join-Path `
                    $userHome `
                    ".android"

                  if (Test-Path -LiteralPath $androidSource) {

                      New-Item `
                        -ItemType Directory `
                        -Path $androidTarget `
                        -Force | Out-Null

                      robocopy `
                        $androidSource `
                        $androidTarget `
                        /E `
                        /R:1 `
                        /W:1 `
                        /XJ `
                        /NFL `
                        /NDL `
                        /NP | Out-Null

                      Write-Host "✅ Restored: .android." -ForegroundColor Green
                  }

              }
              else {

                  Write-Host "ℹ️ No previous backup was found." -ForegroundColor Cyan
                  Write-Host "➡️ Starting with a fresh RDP session." -ForegroundColor Cyan
              }

          }
          catch {

              Write-Host "⚠️ Restore failed: $($_.Exception.Message)" -ForegroundColor Yellow
              Write-Host "➡️ Continuing with a fresh session." -ForegroundColor Yellow
          }

          Remove-Item `
            $archive `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $root `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "🎯 Restore process completed." -ForegroundColor Green
          Write-Host ""


      # ============================================================
      # VERIFY RDP
      # ============================================================
      - name: 🔍 VERIFY RDP CONFIGURATION
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "        🔍 VERIFYING RDP CONFIGURATION" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host ""

          $user = Get-LocalUser `
            -Name "AISTV-PREMIUM" `
            -ErrorAction SilentlyContinue

          if ($user) {
              Write-Host "│ ✅ User exists: AISTV-PREMIUM" -ForegroundColor Green
              Write-Host "│ 📊 Enabled: $($user.Enabled)" -ForegroundColor White
          }
          else {
              Write-Host "│ ❌ User does not exist." -ForegroundColor Red
              exit 1
          }

          $isAdmin = (
              Get-LocalGroupMember `
                -Group "Administrators" `
                -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -like "*AISTV-PREMIUM"
              }
          ).Count -gt 0

          if ($isAdmin) {
              Write-Host "│ ✅ Administrator access confirmed." -ForegroundColor Green
          }
          else {
              Write-Host "│ ❌ Administrator access not found." -ForegroundColor Red
          }

          $isRDPUser = (
              Get-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -like "*AISTV-PREMIUM"
              }
          ).Count -gt 0

          if ($isRDPUser) {
              Write-Host "│ ✅ Remote Desktop access confirmed." -ForegroundColor Green
          }
          else {
              Write-Host "│ ❌ Remote Desktop access not found." -ForegroundColor Red
          }

          $termService = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if ($termService.Status -eq "Running") {
              Write-Host "│ ✅ TermService is running." -ForegroundColor Green
          }
          else {
              Write-Host "│ ❌ TermService is not running." -ForegroundColor Red
          }

          Write-Host ""
          Write-Host "🎯 RDP verification completed." -ForegroundColor Green
          Write-Host ""


      # ============================================================
      # TAILSCALE
      # ============================================================
      - name: 🌐 CONFIGURE TAILSCALE NETWORK
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "        🌐 CONFIGURING TAILSCALE" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host ""

          try {

              $msiPath = "$env:TEMP\tailscale-premium.msi"

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
                -OutFile $msiPath

              Start-Process `
                msiexec.exe `
                -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" `
                -Wait

              Remove-Item `
                $msiPath `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host "│ ✅ Tailscale installed successfully." -ForegroundColor Green
          }
          catch {
              Write-Host "│ ❌ Tailscale installation failed." -ForegroundColor Red
              exit 1
          }

          Start-Sleep -Seconds 10

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Host "❌ Tailscale executable was not found." -ForegroundColor Red
              exit 1
          }

          try {

              & $tailscale up `
                --authkey=$env:TAILSCALE_AUTH_KEY `
                --hostname=ai-stv-premium-$env:GITHUB_RUN_ID `
                --accept-routes `
                --accept-dns `
                --reset

              if ($LASTEXITCODE -ne 0) {
                  throw "Tailscale connection failed."
              }

              Write-Host "│ ✅ Tailscale connection established." -ForegroundColor Green
          }
          catch {
              Write-Host "│ ❌ Failed to connect to Tailscale." -ForegroundColor Red
              exit 1
          }

          Write-Host ""
          Write-Host "🔄 Waiting for Tailscale IPv4 address..." -ForegroundColor Blue

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {

              try {

                  $candidate = (& $tailscale ip -4 2>$null).Trim()

                  if ($candidate -match '^\d+\.\d+\.\d+\.\d+$') {

                      $ip = $candidate

                      "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

                      Write-Host "✅ Tailscale IPv4: $ip" -ForegroundColor Green

                      break
                  }
              }
              catch {
              }

              Write-Host "🔄 Waiting for IP... attempt $($i + 1)/20" -ForegroundColor Blue

              Start-Sleep -Seconds 3
          }

          if (-not $ip) {

              Write-Host "❌ Could not obtain a Tailscale IPv4 address." -ForegroundColor Red
              exit 1
          }

          Write-Host ""


      # ============================================================
      # CONNECTION INFORMATION
      # ============================================================
      - name: 🎉 DISPLAY CONNECTION INFORMATION
        shell: pwsh
        run: |

          $password = Get-Content `
            "$env:TEMP\rdp_password.txt" `
            -ErrorAction SilentlyContinue

          if (-not $password) {
              $password = "Unavailable"
          }

          $durationInput = "${{ github.event.inputs.duration }}"

          switch ($durationInput) {
          
              "20m" {
                  $totalMinutes = 20
                  $displayTime = "20 minutes"
              }

              "1h" {
                  $totalMinutes = 60
                  $displayTime = "1 hour"
              }

              "3h" {
                  $totalMinutes = 180
                  $displayTime = "3 hours"
              }

              "5h40m" {
                  $totalMinutes = 340
                  $displayTime = "5 hours 40 minutes"
              }

              default {
                  $totalMinutes = 340
                  $displayTime = "5 hours 40 minutes"
              }
          }

          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById(
              "SE Asia Standard Time"
          )

          $startTime = [System.TimeZoneInfo]::ConvertTimeFromUtc(
              (Get-Date).ToUniversalTime(),
              $timeZone
          )

          $endTime = $startTime.AddMinutes($totalMinutes)

          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "                 🎉 RDP READY!" -ForegroundColor Green
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "🌐 Tailscale IP : $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "🔌 RDP Port     : 3389" -ForegroundColor White
          Write-Host "👤 Username     : AISTV-PREMIUM" -ForegroundColor White
          Write-Host "🔐 Password     : $password" -ForegroundColor White
          Write-Host "⏰ Duration     : $displayTime" -ForegroundColor White
          Write-Host "🕐 Start time   : $($startTime.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "🕐 End time     : $($endTime.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host ""

          Write-Host "------------------------------------------------------------" -ForegroundColor Cyan
          Write-Host "                📋 CONNECTION GUIDE" -ForegroundColor Cyan
          Write-Host "------------------------------------------------------------" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "1. Open your Remote Desktop client." -ForegroundColor Yellow
          Write-Host "2. Enter: $env:TAILSCALE_IP" -ForegroundColor Yellow
          Write-Host "3. Username: AISTV-PREMIUM" -ForegroundColor Yellow
          Write-Host "4. Enter the password shown above." -ForegroundColor Yellow
          Write-Host ""

          $xfreerdpCommand = "xfreerdp /v:$($env:TAILSCALE_IP):3389 /u:AISTV-PREMIUM /p:'$password' /cert:ignore /f /dynamic-resolution"

          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "🚀 READY-TO-COPY XFREERDP COMMAND" -ForegroundColor Green
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host $xfreerdpCommand -ForegroundColor Green
          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Cyan

          "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

          Write-Host ""


      # ============================================================
      # KEEP SESSION ALIVE
      # ============================================================
      - name: ⏳ KEEP RDP SESSION ALIVE
        shell: pwsh
        run: |

          $totalMinutes = [int]$env:TOTAL_MINUTES

          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById(
              "SE Asia Standard Time"
          )

          $startTime = [System.TimeZoneInfo]::ConvertTimeFromUtc(
              (Get-Date).ToUniversalTime(),
              $timeZone
          )

          $endTime = $startTime.AddMinutes($totalMinutes)

          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "              ⏳ RDP SESSION IS ACTIVE" -ForegroundColor Yellow
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "🌐 Address : $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host "👤 User    : AISTV-PREMIUM" -ForegroundColor White
          Write-Host "🕐 Started : $($startTime.ToString('HH:mm:ss'))" -ForegroundColor Green
          Write-Host "🕐 Ends    : $($endTime.ToString('HH:mm:ss'))" -ForegroundColor Green
          Write-Host ""

          # Background RDP monitor
          $monitorScript = {

              $lastLogTime = Get-Date

              while ($true) {

                  $currentTime = Get-Date

                  if (
                      ($currentTime - $lastLogTime).TotalMinutes -ge 2
                  ) {

                      $termService = Get-Service `
                        -Name TermService `
                        -ErrorAction SilentlyContinue

                      $connections = Get-NetTCPConnection `
                        -LocalPort 3389 `
                        -ErrorAction SilentlyContinue |
                        Where-Object {
                            $_.State -eq "Established"
                        }

                      Write-Host `
                        "[$($currentTime.ToString('HH:mm:ss'))] RDP: $($termService.Status) | Connections: $($connections.Count)" `
                        -ForegroundColor Blue

                      $lastLogTime = $currentTime
                  }

                  $termService = Get-Service `
                    -Name TermService `
                    -ErrorAction SilentlyContinue

                  if (
                      $termService -and
                      $termService.Status -ne "Running"
                  ) {

                      Write-Host `
                        "[$($currentTime.ToString('HH:mm:ss'))] Restarting TermService..." `
                        -ForegroundColor Yellow

                      Start-Service `
                        -Name TermService `
                        -ErrorAction SilentlyContinue
                  }

                  Start-Sleep -Seconds 30
              }
          }

          Start-Job `
            -ScriptBlock $monitorScript `
            -Name "SystemMonitor" | Out-Null

          $frames = @(
              '⠋','⠙','⠹','⠸','⠼',
              '⠴','⠦','⠧','⠇','⠏'
          )

          $startTimer = Get-Date

          do {

              $currentTime = [System.TimeZoneInfo]::ConvertTimeFromUtc(
                  (Get-Date).ToUniversalTime(),
                  $timeZone
              )

              $remaining = $endTime - $currentTime

              $hours = [math]::Max(
                  0,
                  [math]::Floor($remaining.TotalHours)
              )

              $minutes = [math]::Max(
                  0,
                  [math]::Floor($remaining.TotalMinutes % 60)
              )

              $seconds = [math]::Max(
                  0,
                  [math]::Floor($remaining.TotalSeconds % 60)
              )

              $frameIndex = (
                  [int]((Get-Date) - $startTimer).TotalSeconds
              ) % $frames.Length

              $frame = $frames[$frameIndex]

              Write-Host `
                "`r$frame [$($currentTime.ToString('HH:mm:ss'))] Remaining: $hours h $minutes m $seconds s     " `
                -NoNewline `
                -ForegroundColor Cyan

              Start-Sleep -Seconds 5

          }
          while ($remaining.TotalSeconds -gt 0)

          Write-Host ""
          Write-Host ""
          Write-Host "🎯 Session duration has ended." -ForegroundColor Red

          Get-Job `
            -Name "SystemMonitor" `
            -ErrorAction SilentlyContinue |
            Stop-Job `
            -PassThru |
            Remove-Job `
            -Force


      # ============================================================
      # PREPARE BACKUP
      # ============================================================
     - name: Prepare RDP Backup
  shell: pwsh
  run: |
    $backupRoot = "C:\RDP-BACKUP"

    if (Test-Path $backupRoot) {
      Remove-Item $backupRoot -Recurse -Force -ErrorAction SilentlyContinue
    }

    New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null

    function Backup-Folder {
      param (
        [string]$Source,
        [string]$Destination,
        [string]$Name
      )

      if (-not (Test-Path $Source)) {
        Write-Host "⚠️ Skipped: $Name (source folder not found)"
        return
      }

      New-Item -ItemType Directory -Path $Destination -Force | Out-Null

      robocopy $Source $Destination /E /R:1 /W:1 /XJ /NFL /NDL /NP

      $code = $LASTEXITCODE

      if ($code -le 7) {
        Write-Host "✅ Backed up: $Name"
      }
      else {
        Write-Host "⚠️ Backup warning: $Name (robocopy exit code $code)"
      }

      # Prevent robocopy's normal exit codes from failing GitHub Actions
      $global:LASTEXITCODE = 0
    }

    Backup-Folder `
      "$env:USERPROFILE\Desktop" `
      "$backupRoot\Desktop" `
      "Desktop"

    Backup-Folder `
      "$env:USERPROFILE\Documents" `
      "$backupRoot\Documents" `
      "Documents"

    Backup-Folder `
      "$env:USERPROFILE\Downloads" `
      "$backupRoot\Downloads" `
      "Downloads"

    Backup-Folder `
      "$env:LOCALAPPDATA\Google\Chrome\User Data" `
      "$backupRoot\Chrome\User Data" `
      "Chrome User Data"

    Backup-Folder `
      "$env:APPDATA" `
      "$backupRoot\AppData\Roaming" `
      "AppData\Roaming"

    Write-Host ""
    Write-Host "📦 Backup preparation completed."
    Write-Host "📁 Backup location: $backupRoot"

    exit 0


      # ============================================================
      # UPLOAD BACKUP
      # ============================================================
      - name: 📤 UPLOAD RDP BACKUP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-backup
          path: C:\RDP-BACKUP
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6


      # ============================================================
      # CLEANUP
      # ============================================================
      - name: 🧹 CLEANUP SYSTEM
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "                 🧹 CLEANING UP SYSTEM" -ForegroundColor Yellow
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host ""

          $cleanupSteps = @(

              @{
                  Name = "Remove password file"
                  Script = {
                      Remove-Item `
                        "$env:TEMP\rdp_password.txt" `
                        -Force `
                        -ErrorAction SilentlyContinue
                  }
              },

              @{
                  Name = "Disable RDP user"
                  Script = {
                      Disable-LocalUser `
                        -Name "AISTV-PREMIUM" `
                        -ErrorAction SilentlyContinue
                  }
              },

              @{
                  Name = "Disconnect Tailscale"
                  Script = {

                      $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

                      if (Test-Path $tailscale) {

                          & $tailscale down `
                            --accept-risk=all `
                            2>$null

                          if ($LASTEXITCODE -ne 0) {
                              Write-Host "Tailscale was already disconnected." -ForegroundColor Yellow
                          }
                      }
                  }
              },

              @{
                  Name = "Remove firewall rules"
                  Script = {

                      & netsh advfirewall firewall delete rule `
                        name="RDP-Premium" `
                        dir=in `
                        2>$null

                      & netsh advfirewall firewall delete rule `
                        name="RDP-Premium-Out" `
                        dir=out `
                        2>$null

                      Remove-NetFirewallRule `
                        -DisplayName "RDP-Premium" `
                        -ErrorAction SilentlyContinue

                      Remove-NetFirewallRule `
                        -DisplayName "RDP-Premium-Out" `
                        -ErrorAction SilentlyContinue
                  }
              },

              @{
                  Name = "Disable Remote Desktop"
                  Script = {

                      Set-ItemProperty `
                        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                        -Name "fDenyTSConnections" `
                        -Value 1 `
                        -Force `
                        -ErrorAction SilentlyContinue

                      Set-ItemProperty `
                        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                        -Name "UserAuthentication" `
                        -Value 1 `
                        -Force `
                        -ErrorAction SilentlyContinue

                      Stop-Service `
                        -Name TermService `
                        -Force `
                        -ErrorAction SilentlyContinue
                  }
              }
          )

          foreach ($step in $cleanupSteps) {

              Write-Host `
                "│ 🗑️ $($step.Name)..." `
                -NoNewline `
                -ForegroundColor Gray

              try {

                  & $step.Script

                  Write-Host `
                    "`r│ ✅ $($step.Name)                         " `
                    -ForegroundColor Green
              }
              catch {

                  Write-Host `
                    "`r│ ⚠️ $($step.Name) - handled safely       " `
                    -ForegroundColor Yellow
              }

              Start-Sleep -Milliseconds 300
          }

          # Stop remaining PowerShell jobs
          Get-Job |
              Stop-Job `
                -PassThru `
                -ErrorAction SilentlyContinue |
              Remove-Job `
                -Force `
                -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "🎉 Cleanup completed successfully." -ForegroundColor Green
          Write-Host "👋 RDP session has ended." -ForegroundColor Cyan
          Write-Host ""
